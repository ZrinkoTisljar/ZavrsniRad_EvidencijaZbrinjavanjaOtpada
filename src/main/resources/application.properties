spring.application.name=wasteapp

spring.datasource.url=jdbc:mysql://localhost:3307/wasteapp_new?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=wasteuser
spring.datasource.password=wastepass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true



app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32+_CHARS}
app.jwt.expMinutes=120

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8080}
